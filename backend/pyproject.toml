[project]
name = "studyhub"
version = "0.1.0"
description = "Local study hub: Canvas, Gradescope, GoodNotes and Granola in one place, with a Claude agent."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pymupdf>=1.24",
  "markdownify>=0.13",
  "gradescopeapi>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studyhub = "studyhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studyhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
